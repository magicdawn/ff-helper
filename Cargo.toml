[package]
name = "ff-helper"
version = "0.0.1"
description = "ffmpeg helper by native binding"
authors = ["magicdawn"]
license = "MIT"
edition = "2024"
exclude = ["*.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.12.1", features = ["napi4"] }
napi-derive = "3.6.3"
ffmpeg-next = "9.0.0"
ffmpeg-sys-next = "9.0.0"
once_cell = "1.21.4"
env_logger = "0.11.11"
log = "0.4.33"
image = "0.25.10"
rayon = "1.12.0"
mozjpeg = "0.10.13"


[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "debuginfo"
